<div class="header">
  <h2>Employees</h2>
  <button mat-raised-button color="primary" routerLink="/employees/create">
    <mat-icon>add</mat-icon>
    Add Employee
  </button>
</div>

<ng-container *ngIf="loading; else loaded">
  <div class="state-message">Loading...</div>
</ng-container>

<ng-template #loaded>
  <ng-container *ngIf="error; else data">
    <div class="state-message error">
      <p>{{ error }}</p>
      <button mat-stroked-button (click)="loadEmployees()">Retry</button>
    </div>
  </ng-container>

  <ng-template #data>
    <div class="table-wrapper">
    <table mat-table [dataSource]="employees" class="mat-elevation-z1">
      <ng-container matColumnDef="employeeCode">
        <th mat-header-cell *matHeaderCellDef>Code</th>
        <td mat-cell *matCellDef="let e">{{ e.employeeCode }}</td>
      </ng-container>

      <ng-container matColumnDef="fullName">
        <th mat-header-cell *matHeaderCellDef>Full Name</th>
        <td mat-cell *matCellDef="let e">{{ e.fullName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let e">{{ e.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let e">{{ e.role }}</td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef>Department</th>
        <td mat-cell *matCellDef="let e">{{ e.department }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let e">
          <a mat-stroked-button [routerLink]="['/employees', e.employeeId, 'workload']">
            Workload
          </a>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell state-message" [colSpan]="displayedColumns.length">
          No employees found
        </td>
      </tr>
    </table>

    <mat-paginator
      [length]="totalElements"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="[10, 20, 50]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    >
    </mat-paginator>
    </div>
  </ng-template>
</ng-template>
