

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: prams-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=prams
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prams"]
      interval: 5s
      timeout: 5s
      retries: 5

  prams-app:
    build: .
    container_name: prams-backend
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=prams
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - OPENROUTER_API_KEY=OPENROUTER_API_KEY_REMOVED
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  postgres_data:
